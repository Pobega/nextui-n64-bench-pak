minarch_cpu_speed = Performance
minarch_sync_reference = Auto
minarch_rewind_enable = Off

parallel-n64-gfxplugin = rice
parallel-n64-rspplugin = hle
parallel-n64-cpucore = dynamic_recompiler
parallel-n64-disable_expmem = enabled
parallel-n64-framerate = fullspeed
parallel-n64-screensize = 320x240
parallel-n64-pak1 = memory
parallel-n64-alt-map = disabled
parallel-n64-astick-deadzone = 15
parallel-n64-astick-sensitivity = 100

bind D-Pad Up = UP
bind D-Pad Down = DOWN
bind D-Pad Left = LEFT
bind D-Pad Right = RIGHT
bind Start = START
bind A Button (C3) = B
bind B Button (C2) = Y
bind (C1) = A
bind (C4) = X
bind L Shoulder = L1
bind R Shoulder = R1
bind Z Trigger = L2
bind C Buttons Mode = R2
